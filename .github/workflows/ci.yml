name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Safe, non-production placeholders. CI validates source code, not live
      # integrations -- real secrets live only in Vercel's env configuration.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
      TECH_TOKEN_SECRET: ci-placeholder-tech-token-secret
      INTERNAL_WORKER_SECRET: ci-placeholder-internal-worker-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DISABLE_OUTBOUND_SMS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      - run: npm run build
